name: Build Wanxiang Tools (ARM64)

on:
  push:
    branches: [ wanxiang ]
    paths:
      - 'pypinyin/**'
      - 'wanxiang-tools.py'
  workflow_dispatch:

jobs:
  build-arm64:
    # 使用 GitHub 官方提供的 ARM64 运行器（公共仓库免费）
    runs-on: ubuntu-24.04-arm   # 或 ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils imagemagick python3 python3-pip python3-venv

      - name: Set up Python virtual environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install PySide6 requests pyinstaller

      - name: Prepare icon
        run: |
          if [ ! -f icon.ico ]; then touch icon.ico; fi
          # 如果没有真实图标，可以跳过或使用占位符，这里假设存在
          convert icon.ico -resize 256x256 wanxiang-tools.png || true

      - name: Build with PyInstaller
        run: |
          source venv/bin/activate
          pyinstaller -F -w \
            --clean \
            --name wanxiang-tools \
            --paths . \
            --add-data "pypinyin:pypinyin" \
            --hidden-import requests \
            --exclude-module tkinter \
            --exclude-module numpy \
            --exclude-module matplotlib \
            --exclude-module libsystemd \
            --exclude-module PIL \
            --exclude-module cv2 \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtWebEngine \
            --exclude-module PySide6.Qt3DCore \
            -i icon.ico \
            wanxiang-tools.py

      - name: Strip binary (optional)
        run: strip dist/wanxiang-tools || true

      - name: Create .deb package for arm64
        run: |
          VERSION="1.0.${{ github.run_number }}"
          ARCH="arm64"
          mkdir -p deb/usr/local/bin
          mkdir -p deb/usr/share/pixmaps
          mkdir -p deb/usr/share/applications
          mkdir -p deb/DEBIAN

          cp dist/wanxiang-tools deb/usr/local/bin/
          cp wanxiang-tools.png deb/usr/share/pixmaps/ || true

          cat > deb/usr/share/applications/wanxiang-tools.desktop <<EOF
          [Desktop Entry]
          Name=Wanxiang Tools
          Name[zh_CN]=万象词库工具
          Comment=万象词库方案更新工具
          Exec=/usr/local/bin/wanxiang-tools
          Icon=wanxiang-tools
          Terminal=false
          Type=Application
          Categories=Utility;System;
          StartupWMClass=wanxiang-tools
          EOF

          chmod 755 deb/usr/local/bin/wanxiang-tools

          cat > deb/DEBIAN/control <<EOF
          Package: wanxiang-tools
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Depends: libc6, libgcc-s1, libgl1, libxkbcommon-x11-0, libegl1
          Maintainer: Wanxiang <user@example.com>
          Description: 万象词库-刷拼音-辅助码工具 (ARM64)
           支持rime用户词库与固定词库格式，用于帮助维护自己的挂接词库与非万象词库生成的用户词库迁移到万象。
          EOF

          dpkg-deb --build deb "wanxiang-tools_linux_${ARCH}.deb"

      - name: Prepare artifacts
        run: |
          mkdir -p upload
          cp dist/wanxiang-tools upload/               # 通用二进制
          cp *.deb upload/                              # .deb 包
          cp wanxiang-tools.png upload/ || true         # 图标（可选）

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wanxiang-tools-arm64
          path: upload/*

  # 可选：自动创建 GitHub Release
  release:
    needs: build-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: wanxiang-tools-arm64
          path: release_files

      - name: Delete old release (optional)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          gh release delete tool --cleanup-tag --yes || true
          git push origin --delete tool || true
          sleep 5

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: tool
          target_commitish: ${{ github.sha }}
          name: "万象词库工具 (ARM64)"
          body: |
            ## ARM64 专用构建
            - 原生 ARM64 二进制，适用于 Debian/Ubuntu ARM64 系统（树莓派、Armbian、各类 ARM 开发板）。
            - 包含通用二进制和 `.deb` 安装包。

            ## 📦 安装方法
            - **Debian/Ubuntu**: 下载 `wanxiang-tools_linux_arm64.deb`，运行：
              ```
              sudo dpkg -i wanxiang-tools_linux_arm64.deb
              sudo apt install -f   # 如有依赖缺失
              ```
            - **通用二进制**: 下载 `wanxiang-tools`，赋予执行权限：
              ```
              chmod +x wanxiang-tools
              ./wanxiang-tools
              ```
          files: release_files/*
