name: Auto Build Wanxiang Tools

on:
  push:
    branches: 
      - wanxiang
    paths:
      - 'pypinyin/**'
      - 'wanxiang-tools.py'
  workflow_dispatch:

jobs:
  # =================================================
  # 1. Linux 构建 (矩阵：amd64 + arm64)
  # =================================================
  build-linux:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 针对 arm64 配置 QEMU 并准备容器执行
      - name: Set up QEMU (for arm64)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Build in native environment (amd64)
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update && sudo apt-get install -y binutils imagemagick
          python -m venv venv
          source venv/bin/activate
          pip install PySide6 requests pyinstaller

          if [ ! -f icon.ico ]; then touch icon.ico; fi
          convert icon.ico -resize 256x256 wanxiang-tools.png

          pyinstaller -F -w \
            --clean \
            --name wanxiang-tools \
            --paths . \
            --add-data "pypinyin:pypinyin" \
            --hidden-import requests \
            --exclude-module tkinter \
            --exclude-module numpy \
            --exclude-module matplotlib \
            --exclude-module libsystemd \
            --exclude-module PIL \
            --exclude-module cv2 \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtWebEngine \
            --exclude-module PySide6.Qt3DCore \
            -i icon.ico \
            wanxiang-tools.py

          strip dist/wanxiang-tools

      - name: Build in ARM64 container
        if: matrix.arch == 'arm64'
        run: |
          # 将整个仓库挂载到容器，并在容器内执行构建
          docker run --rm --platform linux/arm64 \
            -v $PWD:/workspace -w /workspace \
            arm64v8/ubuntu:22.04 \
            bash -c "
              apt-get update && apt-get install -y binutils imagemagick python3 python3-pip python3-venv
              python3 -m venv venv
              source venv/bin/activate
              pip install PySide6 requests pyinstaller
              if [ ! -f icon.ico ]; then touch icon.ico; fi
              convert icon.ico -resize 256x256 wanxiang-tools.png
              pyinstaller -F -w \
                --clean \
                --name wanxiang-tools \
                --paths . \
                --add-data 'pypinyin:pypinyin' \
                --hidden-import requests \
                --exclude-module tkinter \
                --exclude-module numpy \
                --exclude-module matplotlib \
                --exclude-module libsystemd \
                --exclude-module PIL \
                --exclude-module cv2 \
                --exclude-module PySide6.QtQml \
                --exclude-module PySide6.QtQuick \
                --exclude-module PySide6.QtWebEngine \
                --exclude-module PySide6.Qt3DCore \
                -i icon.ico \
                wanxiang-tools.py
              strip dist/wanxiang-tools
            "

      # --- 制作 .deb 包（区分架构） ---
      - name: Package .deb for ${{ matrix.arch }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          ARCH="${{ matrix.arch }}"
          mkdir -p dist/deb/usr/local/bin
          mkdir -p dist/deb/usr/share/pixmaps
          mkdir -p dist/deb/usr/share/applications
          mkdir -p dist/deb/DEBIAN

          cp dist/wanxiang-tools dist/deb/usr/local/bin/
          cp wanxiang-tools.png dist/deb/usr/share/pixmaps/

          cat > dist/deb/usr/share/applications/wanxiang-tools.desktop <<EOF
          [Desktop Entry]
          Name=Wanxiang Tools
          Name[zh_CN]=万象词库工具
          Comment=万象词库方案更新工具
          Exec=/usr/local/bin/wanxiang-tools
          Icon=wanxiang-tools
          Terminal=false
          Type=Application
          Categories=Utility;System;
          StartupWMClass=wanxiang-tools
          EOF

          chmod 755 dist/wanxiang-tools

          # 控制文件：根据架构填写 Architecture
          cat > dist/deb/DEBIAN/control <<EOF
          Package: wanxiang-tools
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Depends: libc6, libgcc1, libgl1, libxkbcommon-x11-0, libegl1
          Maintainer: Wanxiang <user@example.com>
          Description: 万象词库-刷拼音-辅助码工具
           支持rime用户词库与固定词库格式，用于帮助维护自己的挂接词库与非万象词库生成的用户词库迁移到万象。
          EOF

          dpkg-deb --build dist/deb "dist/wanxiang-tools_linux_${ARCH}.deb"

      # 准备上传产物（扁平目录）
      - name: Prepare Artifacts for ${{ matrix.arch }}
        run: |
          mkdir -p upload_stage_${{ matrix.arch }}
          cp dist/wanxiang-tools upload_stage_${{ matrix.arch }}/
          cp dist/*.deb upload_stage_${{ matrix.arch }}/
          cp wanxiang-tools.png upload_stage_${{ matrix.arch }}/

      - name: Upload ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist-${{ matrix.arch }}
          path: upload_stage_${{ matrix.arch }}/*

  # =================================================
  # 2. Arch Linux 打包 (保持不变，但需注意架构)
  # =================================================
  package-arch:
    needs: build-linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      matrix:
        arch: [amd64, arm64]   # 可能需要分别处理，但 Arch 的二进制需匹配
    steps:
      - name: Download artifacts for ${{ matrix.arch }}
        uses: actions/download-artifact@v4
        with:
          name: linux-dist-${{ matrix.arch }}
          path: build_dir

      - name: Build Arch Package for ${{ matrix.arch }}
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm libglvnd libxcb libxkbcommon fontconfig git

          cd build_dir
          chmod +x wanxiang-tools

          cat > wanxiang-tools.desktop <<EOF
          [Desktop Entry]
          Name=Wanxiang Tools
          Name[zh_CN]=万象词库工具
          Comment=万象词库方案更新工具
          Exec=/usr/bin/wanxiang-tools
          Icon=wanxiang-tools
          Terminal=false
          Type=Application
          Categories=Utility;System;
          StartupWMClass=wanxiang-tools
          EOF

          cp wanxiang-tools.png wanxiang-tools.png.bk
          VERSION="1.0.${{ github.run_number }}"
          ARCH_PKG="${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}"

          cat > PKGBUILD <<EOF
          # Maintainer: Auto Build <ci@github>
          pkgname=wanxiang-tools
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="万象词库方案更新工具 (Auto Build)"
          arch=('${ARCH_PKG}')
          url="https://github.com/${{ github.repository }}"
          license=('GPL')
          depends=('glibc' 'libglvnd' 'libxcb' 'libxkbcommon' 'fontconfig')
          source=("wanxiang-tools" "wanxiang-tools.png" "wanxiang-tools.desktop")
          sha256sums=('SKIP' 'SKIP' 'SKIP')
          options=('!debug' '!strip')

          package() {
              install -Dm755 "\$srcdir/wanxiang-tools" "\$pkgdir/usr/bin/wanxiang-tools"
              install -Dm644 "\$srcdir/wanxiang-tools.png" "\$pkgdir/usr/share/pixmaps/wanxiang-tools.png"
              install -Dm644 "\$srcdir/wanxiang-tools.desktop" "\$pkgdir/usr/share/applications/wanxiang-tools.desktop"
          }
          EOF

          useradd builder -m
          chown -R builder:builder .
          su builder -c "makepkg -f --noconfirm"

          mv *.pkg.tar.zst "../wanxiang-tools_linux_${{ matrix.arch }}.pkg.tar.zst"

      - name: Upload Arch Package for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: arch-pkg-${{ matrix.arch }}
          path: ./*.pkg.tar.zst

  # =================================================
  # 3. Windows 构建 (保持不变)
  # =================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build with PyInstaller
        shell: bash
        run: |
          pip install PySide6 requests pyinstaller
          if [ ! -f icon.ico ]; then touch icon.ico; fi
          pyinstaller -F -w \
            --name wanxiang-tools \
            --paths . \
            --add-data "pypinyin;pypinyin" \
            --hidden-import requests \
            --exclude-module tkinter \
            --exclude-module numpy \
            --exclude-module matplotlib \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtWebEngine \
            -i icon.ico \
            wanxiang-tools.py
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*.exe

  # =================================================
  # 4. macOS 构建 (保持不变)
  # =================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PySide6 requests pyinstaller pillow
      - run: |
          if [ ! -f icon.ico ]; then touch icon.ico; fi
          pyinstaller -F -w \
            --name wanxiang-tools \
            --paths . \
            --add-data "pypinyin:pypinyin" \
            --hidden-import requests \
            --exclude-module tkinter \
            --exclude-module numpy \
            --exclude-module matplotlib \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtWebEngine \
            -i icon.ico \
            wanxiang-tools.py
          cd dist
          zip -r wanxiang-tools-macos.zip wanxiang-tools.app
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/*.zip

  # =================================================
  # 5. 统一发布 (合并所有架构产物)
  # =================================================
  publish:
    needs: [build-linux, package-arch, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Clean up artifacts
        run: |
          cd release_files
          rm -f *.png
          ls -la

      - name: Delete old Release and Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          gh release delete tool --cleanup-tag --yes || true
          git push origin --delete tool || true
          sleep 5

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: tool
          target_commitish: ${{ github.sha }}
          name: "万象词库-刷拼音-辅助码工具 (自动更新)"
          body: |
            ## 功能说明
            - 支持rime用户词库与固定词库格式，用于帮助维护自己的挂接词库与非万象词库生成的用户词库迁移到万象。
            - 公共拼音标注工具 (pypinyin GUI简版)。
            - 支持更新万象各方案、词库、模型，在线更新方案GUI。

            ## 📦 Linux 安装说明
            - **Debian/Ubuntu (amd64)**: 下载 `wanxiang-tools_linux_amd64.deb`，运行 `sudo dpkg -i wanxiang-tools_linux_amd64.deb`
            - **Debian/Ubuntu (arm64)**: 下载 `wanxiang-tools_linux_arm64.deb`，运行 `sudo dpkg -i wanxiang-tools_linux_arm64.deb`
            - **Arch Linux (x86_64)**: 下载 `wanxiang-tools_linux_amd64.pkg.tar.zst`，运行 `sudo pacman -U wanxiang-tools_linux_amd64.pkg.tar.zst`
            - **Arch Linux (aarch64)**: 下载 `wanxiang-tools_linux_arm64.pkg.tar.zst`，运行 `sudo pacman -U wanxiang-tools_linux_arm64.pkg.tar.zst`
            - **通用二进制 (amd64)**: 下载 `wanxiang-tools` (无后缀，来自 amd64 构建)，赋予执行权限后直接运行。
            - **通用二进制 (arm64)**: 下载 `wanxiang-tools` (无后缀，来自 arm64 构建)，赋予执行权限后直接运行。

            ## 🍎 macOS 用户注意
            本版本适用于 Apple Silicon (M1/M2/M3)。如果提示“文件损坏”：
            \`sudo xattr -rd com.apple.quarantine /path/to/wanxiang-tools-macos\`
          files: release_files/*
